<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Appraisal Unit Bekas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js" onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';document.head.appendChild(s)"></script>
<style>
/* Layout idea: kolom input di kiri, aksi + hasil + kurva depresiasi di kanan; versi Sederhana menyembunyikan input lanjutan. */
:root{
  --bg:#eceff2; --surface:#ffffff; --ink:#1b2127; --muted:#5b6670; --line:#d5dadf; --accent:#e0a100; --accent-ink:#1b2127;
  --good:#1f7a46; --warn:#a85f00; --bad:#b83225; --soft:#f5f7f9;
  --display:'Barlow Condensed','Arial Narrow',sans-serif; --body:'IBM Plex Sans','Segoe UI',Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14181c; --surface:#1d2328; --ink:#e8ecef; --muted:#9aa6b0; --line:#323b43; --accent:#f2b21a; --accent-ink:#14181c;
    --good:#4cc47f; --warn:#e8a43a; --bad:#ff7a6b; --soft:#252c33; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14181c; --surface:#1d2328; --ink:#e8ecef; --muted:#9aa6b0; --line:#323b43; --accent:#f2b21a; --accent-ink:#14181c;
  --good:#4cc47f; --warn:#e8a43a; --bad:#ff7a6b; --soft:#252c33; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
body[data-mode="simple"] .adv{display:none !important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:3px solid var(--accent);padding-bottom:12px;margin-bottom:18px}
h1{font-family:var(--display);font-weight:700;font-size:34px;letter-spacing:.01em;margin:0;text-transform:uppercase;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0}
.tools{display:flex;gap:10px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:880px){.grid{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.card h2{font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.03em;margin:0 0 10px;text-wrap:balance}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f.full{grid-column:1/-1}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tri .tl{font-size:11.5px;color:var(--muted)}
.tri .on input{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
label{font-size:12.5px;color:var(--muted);font-weight:500}
input,select{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.hint{font-size:11.5px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
button{font:inherit;font-weight:600;background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:7px 12px;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.actions button{padding:10px 18px;font-size:15px}
.lang{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.lang button{background:transparent;color:var(--muted);border-radius:0;padding:6px 12px;font-size:13px}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.modenote{font-size:12.5px;color:var(--muted);border-left:3px solid var(--accent);padding:2px 10px;margin:0}
.comp{display:grid;grid-template-columns:1.1fr 1.2fr .8fr;gap:8px;align-items:center}
.comp .ch{font-size:11.5px;color:var(--muted);font-weight:500}
.comp .cn{font-size:13.5px}
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px;border-left:5px solid var(--line)}
.tile.main{border-left-color:var(--accent)}
.tile .k{font-size:12.5px;color:var(--muted);font-weight:500}
.tile .v{font-family:var(--display);font-size:34px;font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.tile .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500}
td.n,th.n{text-align:right;white-space:nowrap}
td.note{color:var(--muted);font-size:12.5px}
tr.sum td{font-weight:600;background:var(--soft)}
tr.neg td.n{color:var(--bad)}
tr.sel td{font-weight:600;background:var(--soft)}
tr.sec td{font-family:var(--display);font-size:16px;text-transform:uppercase;letter-spacing:.03em;background:var(--soft);border-bottom:2px solid var(--accent)}
.scroll{overflow-x:auto}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;border:1px solid currentColor}
.pill.good{color:var(--good)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}
.alert{border:1px solid var(--warn);color:var(--warn);border-radius:6px;padding:8px 10px;font-size:13px;margin-bottom:10px}
.report{border-left:5px solid var(--accent)}
.report .meta{color:var(--muted);font-size:13px;margin:0 0 8px}
.report .concl{margin:12px 0 0;padding:10px 12px;background:var(--soft);border-radius:6px}
.report .rt{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--muted);font-family:var(--body);font-size:11px}
.gridline{stroke:var(--line);stroke-width:1}
.curve{stroke:var(--accent);stroke-width:3;fill:none}
.area{fill:var(--accent);opacity:.12}
.floor{stroke:var(--muted);stroke-dasharray:4 4;stroke-width:1}
.mark{fill:var(--ink)}
.markline{stroke:var(--ink);stroke-width:1;stroke-dasharray:3 3}
#results.stale{opacity:.5}
.foot{font-size:12.5px;color:var(--muted)}
.foot p{margin:4px 0}
</style>
</head>
<body data-mode="simple">
<div class="wrap">
  <header>
    <div>
      <h1 data-i18n="h1"></h1>
      <p class="sub" data-i18n="sub"></p>
    </div>
    <div class="tools">
      <div class="lang" role="group" data-i18n-aria="modeLabel">
        <button type="button" id="modeSimple" aria-pressed="true" data-i18n="modeSimple"></button>
        <button type="button" id="modeAdv" aria-pressed="false" data-i18n="modeAdv"></button>
      </div>
      <div class="lang" role="group" data-i18n-aria="curLabel">
        <button type="button" id="curUsd" aria-pressed="true">US$</button>
        <button type="button" id="curIdr" aria-pressed="false">Rp</button>
      </div>
      <div class="lang" role="group" data-i18n-aria="langLabel">
        <button type="button" id="langId" aria-pressed="true">ID</button>
        <button type="button" id="langEn" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>

  <div class="grid">
    <div class="col">
      <section class="card">
        <h2 data-i18n="s1"></h2>
        <div class="fields">
          <div class="f full">
            <label for="preset" data-i18n="lPreset"></label>
            <select id="preset"></select>
          </div>
          <div class="f">
            <label for="work" data-i18n="lWork"></label>
            <select id="work">
              <option value="0" data-i18n="wLight"></option>
              <option value="1" data-i18n="wMed"></option>
              <option value="2" data-i18n="wHeavy"></option>
            </select>
          </div>
          <div class="f"><label for="price" data-i18n="lPrice"></label><input id="price" type="number" min="0"></div>
          <div class="f"><label for="res" data-i18n="lRes"></label><input id="res" type="number" min="0" max="100" step="1"></div>
          <div class="f adv"><label for="annual" data-i18n="lAnnual"></label><input id="annual" type="number" min="1" step="100"></div>
          <div class="f full">
            <label data-i18n="lLife"></label>
            <div class="tri" id="triLife">
              <div class="t0"><div class="tl" data-i18n="wLightS"></div><input id="lifeL" type="number" min="1" step="500" data-i18n-aria="wLight"></div>
              <div class="t1"><div class="tl" data-i18n="wMedS"></div><input id="lifeM" type="number" min="1" step="500" data-i18n-aria="wMed"></div>
              <div class="t2"><div class="tl" data-i18n="wHeavyS"></div><input id="lifeH" type="number" min="1" step="500" data-i18n-aria="wHeavy"></div>
            </div>
          </div>
          <div class="f adv"><label for="tyre" data-i18n="lTyre"></label><input id="tyre" type="number" min="0"></div>
          <div class="f full hint" data-i18n="hint1"></div>
        </div>
        <div class="row adv">
          <input id="pname" type="text" data-i18n-ph="phPname" data-i18n-aria="phPname" style="flex:1;min-width:140px">
          <button class="ghost" id="savePreset" type="button" data-i18n="btnSave"></button>
        </div>
        <div class="hint adv" id="saveMsg" role="status"></div>
      </section>

      <section class="card">
        <h2 data-i18n="s2"></h2>
        <div class="fields">
          <div class="f adv"><label for="uid" data-i18n="lUid"></label><input id="uid" type="text" maxlength="60"></div>
          <div class="f adv"><label for="seller" data-i18n="lSeller"></label><input id="seller" type="text" maxlength="80"></div>
          <div class="f adv"><label for="year" data-i18n="lYear"></label><input id="year" type="number" min="1980" max="2100" step="1"></div>
          <div class="f"><label for="hm" data-i18n="lHm"></label><input id="hm" type="number" min="0" step="100"></div>
          <div class="f"><label for="cond" data-i18n="lCond"></label><input id="cond" type="number" min="0" max="150" step="1"></div>
          <div class="f adv"><label for="tread" data-i18n="lTread"></label><input id="tread" type="number" min="0" max="100" step="5"></div>
          <div class="f full hint" data-i18n="hint2"></div>
        </div>
      </section>

      <section class="card">
        <h2 data-i18n="s3"></h2>
        <div class="fields">
          <div class="f"><label for="repair" data-i18n="lRepair"></label><input id="repair" type="number" min="0"></div>
          <div class="f"><label for="margin" data-i18n="lMargin"></label><input id="margin" type="number" min="0" max="80" step="1"></div>
          <div class="f adv"><label for="logi" data-i18n="lLogi"></label><input id="logi" type="number" min="0"></div>
          <div class="f"><label for="fx" data-i18n="lFx"></label><input id="fx" type="number" min="1" step="50"></div>
          <div class="f full adv"><label for="mkt" data-i18n="lMkt"></label><input id="mkt" type="number" min="0" data-i18n-ph="phMkt"></div>
          <div class="f full hint" data-i18n="hint3"></div>
        </div>
      </section>

      <section class="card adv" id="cardComp">
        <h2 data-i18n="s4"></h2>
        <div class="fields">
          <div class="f full"><label for="ohw" data-i18n="lOhw"></label><input id="ohw" type="number" min="0" max="100" step="5"></div>
        </div>
        <div class="comp" id="compGrid" style="margin-top:10px">
          <div class="ch" data-i18n="thComp"></div><div class="ch" data-i18n="thCost"></div><div class="ch" data-i18n="thUsed"></div>
        </div>
        <div class="hint" style="margin-top:8px" data-i18n="hint4"></div>
      </section>
    </div>

    <div class="col">
      <div class="actions">
        <button type="button" id="btnAppraisal" data-i18n="bAppraisal"></button>
        <button type="button" class="ghost" id="btnExport" data-i18n="bExport"></button>
        <span class="hint" id="actMsg" role="status"></span>
      </div>
      <p class="modenote" id="modeNote"></p>

      <section class="card report" id="report" hidden>
        <div class="rt">
          <div>
            <h2 data-i18n="repTitle" style="margin-bottom:2px"></h2>
            <p class="meta" id="repMeta"></p>
          </div>
          <button type="button" class="ghost" id="repClose" data-i18n="repClose"></button>
        </div>
        <div class="scroll"><table><tbody id="repRows"></tbody></table></div>
        <p class="concl" id="repConcl"></p>
        <p class="hint" data-i18n="repDisclaimer"></p>
        <div class="row">
          <button type="button" class="ghost" id="repCopy" data-i18n="repCopy"></button>
          <span class="hint" id="repMsg" role="status"></span>
        </div>
      </section>

      <p class="modenote" id="placeholder" data-i18n="placeholder"></p>
      <div id="stale" class="alert" hidden role="status" data-i18n="staleMsg"></div>
      <div id="results" class="col" hidden>
      <div id="warn"></div>
      <div class="hero">
        <div class="tile main"><div class="k" data-i18n="kBid"></div><div class="v" id="tBid">-</div><div class="s" id="tBidRp"></div></div>
        <div class="tile"><div class="k" data-i18n="kFair"></div><div class="v" id="tFair">-</div><div class="s" id="tFairRp"></div></div>
        <div class="tile"><div class="k" data-i18n="kBook"></div><div class="v" id="tBook">-</div><div class="s" id="tBookS"></div></div>
      </div>

      <section class="card">
        <h2 data-i18n="hRows"></h2>
        <div class="scroll"><table>
          <thead><tr><th data-i18n="thItem"></th><th class="n" id="thCur">US$</th><th data-i18n="thHow"></th></tr></thead>
          <tbody id="rows"></tbody>
        </table></div>
      </section>

      <section class="card">
        <h2 data-i18n="hCond"></h2>
        <div class="scroll"><table>
          <thead><tr><th data-i18n="thWork"></th><th class="n" data-i18n="thLife"></th><th class="n" data-i18n="thBookNt"></th><th class="n" data-i18n="thDiffSel"></th></tr></thead>
          <tbody id="condTbl"></tbody>
        </table></div>
      </section>

      <section class="card">
        <h2 data-i18n="hChart"></h2>
        <div id="chart" role="img" data-i18n-aria="chartAria"></div>
        <div class="foot" id="usage"></div>
      </section>

      <section class="card">
        <h2 data-i18n="hSens"></h2>
        <div class="scroll"><table>
          <thead><tr><th>HM</th><th class="n" data-i18n="thBookNt"></th><th class="n" data-i18n="thDiff"></th></tr></thead>
          <tbody id="sens"></tbody>
        </table></div>
      </section>

      </div>

      <section class="card foot" data-i18n-html="footer"></section>
    </div>
  </div>
</div>

  };

  var LANGKEY = 'appraisal-lang-v1', CURKEY = 'appraisal-cur-v1', MODEKEY = 'appraisal-mode-v1';
  var lang = 'id', cur = 'USD', mode = 'simple';
  try {
    var l0 = localStorage.getItem(LANGKEY); if (l0 === 'id' || l0 === 'en') lang = l0;
    var c0 = localStorage.getItem(CURKEY); if (c0 === 'USD' || c0 === 'IDR') cur = c0;
    var m0 = localStorage.getItem(MODEKEY); if (m0 === 'simple' || m0 === 'adv') mode = m0;
  } catch (e) {}
  var rc = cur, snap = null, stale = false;   // rc = mata uang yang sedang dirender; snap = hasil appraisal terakhir
  function sym(code){ return (code || rc) === 'IDR' ? 'Rp' : 'US$'; }
  function inCur(code, fn){ var old = rc; rc = code; try { return fn(); } finally { rc = old; } }
  function t(key){
    var str = (I18N[lang] && I18N[lang][key] != null) ? I18N[lang][key] : (I18N.id[key] != null ? I18N.id[key] : key);
    for (var i = 1; i < arguments.length; i++) str = str.split('{' + (i - 1) + '}').join(arguments[i]);
    return str.split('{c}').join(sym());
  }
  function esc(x){ return String(x).replace(/[&<>"]/g, function(ch){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]; }); }
  function isAdv(){ return mode === 'adv'; }
  var WK = ['wLightS','wMedS','wHeavyS'];

  /* ---------- Preset ---------- */
  var CATP = CATRAW.map(function(r){
    return {name:r[0], group:'cat', price:null, tyre:0, life:[r[1], r[2], r[3]], res:20, annual:5000};
  });
  CATP.forEach(function(p){ if (p.name === 'D8R') p.price = 404000; });
  CATP.sort(function(a, b){ return (b.name === 'D8R') - (a.name === 'D8R'); });   // D8R paling atas
  var OTHERP = [
    {name:'Komatsu HD465-7', group:'other', price:620000, tyre:46800, life:[26000, 26000, 26000], res:30, annual:5400},
    {name:'NHL TR50 (rigid dump)', group:'other', price:400000, tyre:0, life:[15000, 15000, 15000], res:20, annual:3000}
  ];
  var KEY = 'appraisal-presets-v2';

  custom.forEach(function(p){ p.group = 'mine'; });

  var $ = function(id){ return document.getElementById(id); };
  var MONEY = ['price','tyre','repair','logi','mkt','c0c','c1c','c2c','c3c','c4c'];
  var STEP = {USD:{price:1000,tyre:100,repair:500,logi:500,mkt:1000,comp:5000}, IDR:{price:10000000,tyre:1000000,repair:5000000,logi:5000000,mkt:10000000,comp:50000000}};
  var COMPIDS = [];
  for (var ci = 0; ci < 5; ci++) COMPIDS.push('c' + ci + 'c', 'c' + ci + 'u');
  var allIds = ['price','tyre','res','annual','lifeL','lifeM','lifeH','work','year','hm','tread','cond','repair','margin','logi','fx','mkt','ohw','uid','seller'].concat(COMPIDS);

  // tabel komponen besar
  (function(){
    var g = $('compGrid'), h = '';

      h += '<div class="cn" data-i18n="comp' + i + '"></div>' +
           '<input id="c' + i + 'c" type="number" min="0">' +
           '<input id="c' + i + 'u" type="number" min="0" max="100" step="5">';
    }
    g.insertAdjacentHTML('beforeend', h);
  })();

  function fxNow(){ var v = parseFloat($('fx').value); return isFinite(v) && v > 0 ? v : 1; }
  function toCur(usd){ return cur === 'IDR' ? Math.round(usd * fxNow()) : Math.round(usd * 100) / 100; }
  function toUsd(v){ return cur === 'IDR' ? Math.round(v / fxNow() * 100) / 100 : v; }

  function presets(){ return CATP.concat(OTHERP, custom); }
  function fillSelect(sel){
    var sl = $('preset'); sl.innerHTML = '';
    var gl = {cat:document.createElement('optgroup'), other:document.createElement('optgroup'), mine:document.createElement('optgroup')};
    gl.cat.label = t('groupCat'); gl.other.label = t('groupOther'); gl.mine.label = t('groupMine');
    presets().forEach(function(p, i){
      var o = document.createElement('option'); o.value = i; o.textContent = p.name; gl[p.group].appendChild(o);
    });
    ['cat','other','mine'].forEach(function(k){ if (gl[k].children.length) sl.appendChild(gl[k]); });
    if (sel != null) sl.value = sel;
  }
  function applyPreset(i){
    var p = presets()[i]; if (!p) return;
    $('price').value = p.price == null ? '' : toCur(p.price);
    $('tyre').value = toCur(p.tyre || 0);
    $('res').value = p.res; $('annual').value = p.annual;
    $('lifeL').value = p.life[0]; $('lifeM').value = p.life[1]; $('lifeH').value = p.life[2];
  }
  function setSteps(){
    ['price','tyre','repair','logi','mkt'].forEach(function(k){ $(k).step = STEP[cur][k]; });
    for (var i = 0; i < 5; i++) $('c' + i + 'c').step = STEP[cur].comp;
  }

  // contoh awal: unit D8R (Caterpillar), 12.000 HM
  var D = {work:1, year:2021, hm:12000, tread:50, cond:100, repair:0, logi:0, margin:10, fx:16000, mkt:'', ohw:50, uid:'', seller:''};
  Object.keys(D).forEach(function(k){ $(k).value = D[k]; });
  for (var cj = 0; cj < 5; cj++){ $('c' + cj + 'c').value = 0; $('c' + cj + 'u').value = 50; }
  fillSelect(0); applyPreset(0);

  function num(id, def){
    var v = parseFloat($(id).value);
    return isFinite(v) ? v : (def == null ? 0 : def);
  }
  var nf, nf2;
  function setLocale(){
    var loc = lang === 'id' ? 'id-ID' : 'en-US';
    nf = new Intl.NumberFormat(loc, {maximumFractionDigits:0});
    nf2 = new Intl.NumberFormat(loc, {minimumFractionDigits:2, maximumFractionDigits:2});
  }
  setLocale();
  function curFmt(v, code){ return (v < 0 ? '-' : '') + sym(code) + ' ' + nf.format(Math.abs(Math.round(v))); }
  function pri(v){ return curFmt(v, rc); }
  function oth(v, fx){ return rc === 'IDR' ? curFmt(v / fx, 'USD') : curFmt(v * fx, 'IDR'); }
  function plain(v){ return (v < 0 ? '-' : '') + nf.format(Math.abs(Math.round(v))); }
  function m2(v){ return rc === 'IDR' ? nf.format(Math.round(v)) : nf2.format(v); }

  function compute(){
    var adv = isAdv();
    var price = num('price'), life3 = [num('lifeL', 1), num('lifeM', 1), num('lifeH', 1)].map(function(x){ return Math.max(1, x); });
    var wi = Math.min(2, Math.max(0, parseInt($('work').value, 10) || 0)), life = life3[wi];
    var res = num('res') / 100, hm = Math.max(0, num('hm')), cond = num('cond', 100) / 100;
    var repair = num('repair'), margin = num('margin') / 100, fx = fxNow();
    var tyre = adv ? Math.min(num('tyre'), price) : 0;
    var tread = adv ? Math.min(100, Math.max(0, num('tread'))) / 100 : 0;
    var logi = adv ? num('logi') : 0;
    var ohw = adv ? num('ohw') / 100 : 0;
    var comps = [], sumCU = 0;
    for (var i = 0; i < 5; i++){
      var cc = adv ? num('c' + i + 'c') : 0, cu = Math.min(100, Math.max(0, num('c' + i + 'u'))) / 100;
      comps.push({cost:cc, used:cu}); sumCU += cc * cu;
    }
    var mkRaw = parseFloat($('mkt').value), mkt = adv && isFinite(mkRaw) && mkRaw > 0 ? mkRaw : null;

    var base = price - tyre;
    var resid = res * base;
    var netDep = base - resid;
    var perHr = netDep / life;
    var usedHm = Math.min(hm, life);
    var dep = perHr * usedHm;
    var bookNoTyre = base - dep;
    var tyreVal = tyre * tread;
    var book = bookNoTyre + tyreVal;
    var adj = book * cond;
    var deferred = ohw * sumCU;
    var fair = Math.max(0, adj - deferred - repair - logi);
    var bid = fair * (1 - margin);
    var byWork = life3.map(function(L){ var ph = netDep / L; return {life:L, book:base - ph * Math.min(hm, L)}; });
    return {adv:adv, price:price, tyre:tyre, life:life, life3:life3, wi:wi, res:res, hm:hm, tread:tread, cond:cond, ohw:ohw, comps:comps, sumCU:sumCU,
      repair:repair, logi:logi, margin:margin, fx:fx, mkt:mkt, base:base, resid:resid, netDep:netDep, perHr:perHr, dep:dep,
      bookNoTyre:bookNoTyre, tyreVal:tyreVal, book:book, adj:adj, deferred:deferred, fair:fair, bid:bid, usedHm:usedHm,
      annual:num('annual', 1), byWork:byWork,
      cur:cur, name:presetName(), uid:$('uid').value.trim(), seller:$('seller').value.trim(), yearRaw:$('year').value.trim()};
  }

  function row(label, val, note, cls){
    return '<tr class="' + (cls || '') + '"><td>' + label + '</td><td class="n">' + val + '</td><td class="note">' + note + '</td></tr>';
  }
  function ageOf(c){
    if (!c.adv) return null;
    var yr = parseFloat(c.yearRaw);
    return isFinite(yr) ? Math.max(1, new Date().getFullYear() - yr) : null;
  }

  function chart(c){
    var W = 640, H = 270, L = 72, R = 16, T = 14, B = 38;
    var pw = W - L - R, ph = H - T - B;
    var ymax = Math.max(1, c.base * 1.05), ymin = 0;
    var div = rc === 'IDR' ? 1e6 : 1000;
    function X(h){ return L + (h / c.life) * pw; }
    function Y(v){ return T + (1 - (v - ymin) / (ymax - ymin)) * ph; }
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">';
    var yt = 4, i;
    for (i = 0; i <= yt; i++){
      var v = ymax * i / yt, y = Y(v);
      s += '<line class="gridline" x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '"/>';
      s += '<text x="' + (L - 6) + '" y="' + (y + 4) + '" text-anchor="end">' + nf.format(Math.round(v / div)) + t(rc === 'IDR' ? 'cKidr' : 'cKusd') + '</text>';
    }
    var step = c.life > 30000 ? 10000 : (c.life > 20000 ? 5000 : (c.life > 8000 ? 2500 : 1000));
    for (var h = 0; h <= c.life; h += step){
      s += '<text x="' + X(h) + '" y="' + (H - 18) + '" text-anchor="middle">' + nf.format(h) + '</text>';
    }
    s += '<text x="' + (L + pw / 2) + '" y="' + (H - 3) + '" text-anchor="middle">' + t(rc === 'IDR' ? 'cXidr' : 'cXusd') + '</text>';
    s += '<path class="area" d="M' + X(0) + ',' + Y(c.base) + ' L' + X(c.life) + ',' + Y(c.resid) + ' L' + X(c.life) + ',' + Y(0) + ' L' + X(0) + ',' + Y(0) + ' Z"/>';
    s += '<line class="floor" x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(c.resid) + '" y2="' + Y(c.resid) + '"/>';
    s += '<text x="' + (L + 6) + '" y="' + (Y(c.resid) - 5) + '">' + t('cResid', nf.format(Math.round(c.resid))) + '</text>';
    s += '<path class="curve" d="M' + X(0) + ',' + Y(c.base) + ' L' + X(c.life) + ',' + Y(c.resid) + '"/>';
    var mx = X(c.usedHm), my = Y(c.bookNoTyre);
    s += '<line class="markline" x1="' + mx + '" x2="' + mx + '" y1="' + my + '" y2="' + Y(0) + '"/>';
    s += '<circle class="mark" cx="' + mx + '" cy="' + my + '" r="5"/>';
    var anchor = mx > W - 200 ? 'end' : 'start', tx = anchor === 'end' ? mx - 9 : mx + 9;
    s += '<text x="' + tx + '" y="' + (my - 9) + '" text-anchor="' + anchor + '" style="fill:var(--ink);font-weight:600">' + nf.format(Math.round(c.hm)) + ' HM: ' + nf.format(Math.round(c.bookNoTyre)) + '</text>';
    s += '</svg>';
    $('chart').innerHTML = s;
  }

  /* ---------- Laporan appraisal ---------- */
  var reportOpen = false;
  function presetName(){ return $('preset').selectedOptions.length ? $('preset').selectedOptions[0].textContent : ''; }
  function reportData(c){
    var age = ageOf(c), uid = c.adv ? c.uid : '', seller = c.adv ? c.seller : '';
    var both = function(v){ return pri(v) + ' (' + oth(v, c.fx) + ')'; };
    var out = [];
    out.push({h:t('repUnit')});
    out.push([t('repModel'), c.name]);
    if (uid) out.push([t('lUid'), uid]);
    if (seller) out.push([t('lSeller'), seller]);
    if (c.adv && isFinite(parseFloat(c.yearRaw))) out.push([t('lYear'), c.yearRaw]);
    out.push([t('lWork'), t(WK[c.wi]) + ' (' + nf.format(c.life) + ' ' + (lang === 'id' ? 'jam' : 'hours') + ')']);
    out.push([t('lHm'), nf.format(c.hm)]);
    if (age) out.push([t('repAge'), t('repAgeVal', age, nf.format(Math.round(c.hm / age)))]);
    if (c.adv) out.push([t('lTread'), nf.format(Math.round(c.tread * 100)) + '%']);
    out.push([t('lCond'), nf.format(Math.round(c.cond * 100)) + '%']);
    out.push({h:t('repBasis')});
    out.push([t('rPrice'), both(c.price)]);
    out.push([t('lRes'), nf2.format(c.res * 100) + '%']);
    out.push([t('rPerHr'), sym() + ' ' + m2(c.perHr)]);
    out.push([t('rBookTot'), both(c.book)]);
    out.push({h:t('repAdj')});
    out.push([t('rCond'), both(c.adj)]);
    if (c.adv) out.push([t('rDefer'), both(-c.deferred)]);
    out.push([t('rRepair'), both(-c.repair)]);
    if (c.adv) out.push([t('rLogi'), both(-c.logi)]);
    out.push({h:t('repResult')});
    out.push([t('rFair'), both(c.fair)]);
    out.push([t('rMargin'), nf.format(Math.round(c.margin * 100)) + '%']);
    out.push([t('rBid'), both(c.bid)]);
    if (c.mkt != null && c.fair > 0){
      var d = (c.mkt / c.fair - 1) * 100;
      out.push([t('lMkt'), both(c.mkt) + ' — ' + (d > 0 ? t('cmpAbove', nf.format(Math.round(d))) : (d < 0 ? t('cmpBelow', nf.format(Math.round(-d))) : t('cmpSame')))]);
    }
    return {rows:out, concl:t('repConcl', both(c.fair), both(c.bid))};
  }
  function dateStr(){
    return new Date().toLocaleDateString(lang === 'id' ? 'id-ID' : 'en-GB', {day:'numeric', month:'long', year:'numeric'});
  }
  function renderReport(c){
    var r = reportData(c), h = '';
    r.rows.forEach(function(x){
      if (x.h) h += '<tr class="sec"><td colspan="2">' + esc(x.h) + '</td></tr>';
      else h += '<tr><td>' + esc(x[0]) + '</td><td class="n" style="white-space:normal">' + esc(x[1]) + '</td></tr>';
    });
    $('repRows').innerHTML = h;
    $('repConcl').textContent = r.concl;
    $('repMeta').textContent = t('repDate') + ': ' + dateStr();
  }
  function reportText(c){
    var r = reportData(c), lines = [t('repTitle').toUpperCase(), t('repDate') + ': ' + dateStr(), ''];
    r.rows.forEach(function(x){
      if (x.h) lines.push('', x.h.toUpperCase()); else lines.push(x[0] + ': ' + x[1]);
    });
    lines.push('', r.concl, t('repDisclaimer'));
    return lines.join('\n');
  }

  /* ---------- Export Excel (rumus hidup) ---------- */
  function buildXlsx(c){
    var EX = window.ExcelJS;
    var wb = new EX.Workbook(); wb.creator = 'Appraisal Unit Bekas';
    var ws = wb.addWorksheet(t('xSheet'));
    ws.columns = [{width:50},{width:24},{width:16}];
    var CU = c.cur, F = 'Arial', BLUE = 'FF0000FF', money = '#,##0', money2 = CU === 'IDR' ? '#,##0' : '#,##0.00';
    var YEL = {type:'pattern', pattern:'solid', fgColor:{argb:'FFFFF2CC'}}, GRN = {type:'pattern', pattern:'solid', fgColor:{argb:'FFE2EFDA'}};
    function font(o){ return Object.assign({name:F, size:10}, o || {}); }
    function sec(r, txt, bTxt, cTxt){
      var cells = [ws.getCell('A' + r), ws.getCell('B' + r), ws.getCell('C' + r)];
      cells[0].value = txt; if (bTxt) cells[1].value = bTxt; if (cTxt) cells[2].value = cTxt;
      cells.forEach(function(x){ x.font = font({bold:true, size:11}); x.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FFD9E1F2'}}; });
      cells[1].alignment = {horizontal:'right'}; cells[2].alignment = {horizontal:'right'};
    }
    function put(r, label, val, fmt, isInput, bold){
      var a = ws.getCell('A' + r), b = ws.getCell('B' + r);
      a.value = label; a.font = font({bold:!!bold});
      b.value = val; b.font = font({color:isInput ? {argb:BLUE} : undefined, bold:!!bold});
      if (fmt) b.numFmt = fmt;
      if (isInput) b.fill = YEL;
      b.alignment = {horizontal:'right'};
    }
    function fml(r, label, f, result, fmt, bold){ put(r, label, {formula:f, result:result}, fmt, false, bold); }

    ws.getCell('A1').value = t('repTitle'); ws.getCell('A1').font = font({bold:true, size:14});
    ws.getCell('A2').value = t('repDate') + ': ' + dateStr() + '  |  ' + t('xMode') + ': ' + t(c.adv ? 'modeAdv' : 'modeSimple'); ws.getCell('A2').font = font({italic:true, size:9});
    ws.getCell('A3').value = t('xNote'); ws.getCell('A3').font = font({italic:true, size:9});

    sec(4, t('xIn'));
    var yr = parseFloat(c.yearRaw);
    put(5, t('repModel'), c.name, null, true);
    put(6, t('lUid'), (c.adv && c.uid) || null, null, true);
    put(7, t('lSeller'), (c.adv && c.seller) || null, null, true);
    put(8, t('lYear'), (c.adv && isFinite(yr)) ? yr : null, '0', true);
    put(9, t('xCur'), CU, null, true);
    put(10, t('lFx'), c.fx, money, true);
    put(11, t('xWork'), c.wi + 1, '0', true);
    put(12, t('xLifeL'), c.life3[0], money, true);
    put(13, t('xLifeM'), c.life3[1], money, true);
    put(14, t('xLifeH'), c.life3[2], money, true);
    put(15, t('lPrice'), c.price, money, true);
    put(16, t('lTyre'), c.tyre, money, true);
    put(17, t('lRes'), c.res, '0.0%', true);
    put(18, t('lAnnual'), c.annual, money, true);
    put(19, t('lHm'), c.hm, money, true);
    put(20, t('lTread'), c.tread, '0%', true);
    put(21, t('lCond'), c.cond, '0%', true);
    put(22, t('lRepair'), c.repair, money, true);
    put(23, t('lLogi'), c.logi, money, true);
    put(24, t('lOhw'), c.ohw, '0%', true);
    put(25, t('lMargin'), c.margin, '0.0%', true);
    put(26, t('lMkt'), c.mkt, money, true);

    sec(28, t('xComp'), t('thCost'), t('thUsed'));
    for (var i = 0; i < 5; i++){
      var r = 29 + i;
      put(r, t('comp' + i), c.comps[i].cost, money, true);
      var cc = ws.getCell('C' + r); cc.value = c.comps[i].used; cc.numFmt = '0%'; cc.font = font({color:{argb:BLUE}}); cc.fill = YEL; cc.alignment = {horizontal:'right'};
    }

    sec(35, t('xCalc'));
    fml(36, t('xLifeUsed'), 'CHOOSE(B11,B12,B13,B14)', c.life, money);
    fml(37, t('rBase'), 'B15-B16', c.base, money);
    fml(38, t('rResid'), 'B17*B37', c.resid, money);
    fml(39, t('rNetDep'), 'B37-B38', c.netDep, money);
    fml(40, t('rPerHr'), 'B39/B36', c.perHr, money2);
    fml(41, t('rDepUsed'), 'B40*MIN(B19,B36)', c.dep, money);
    fml(42, t('rBookNt'), 'B37-B41', c.bookNoTyre, money, true);
    fml(43, t('rTyreVal'), 'B16*B20', c.tyreVal, money);
    fml(44, t('rBookTot'), 'B42+B43', c.book, money, true);
    fml(45, t('rCond'), 'B44*B21', c.adj, money);
    fml(46, t('rDefer'), 'B24*SUMPRODUCT(B29:B33,C29:C33)', c.deferred, money);
    fml(47, t('rFair'), 'MAX(0,B45-B46-B22-B23)', c.fair, money, true);
    fml(48, t('rMargin'), 'B47*B25', c.fair - c.bid, money);
    fml(49, t('rBid'), 'B47-B48', c.bid, money, true);
    fml(50, t('xUsdVal'), 'IF(B9="IDR",B49/B10,B49)', CU === 'IDR' ? c.bid / c.fx : c.bid, '#,##0');
    fml(51, t('xIdrVal'), 'IF(B9="IDR",B49,B49*B10)', CU === 'IDR' ? c.bid : c.bid * c.fx, '#,##0');
    var vs = (c.mkt != null && c.fair > 0) ? c.mkt / c.fair - 1 : '';
    fml(52, t('xVsMkt'), 'IF(AND(ISNUMBER(B26),B26>0,B47>0),B26/B47-1,"")', vs, '0.0%');
    ws.getCell('B47').fill = GRN; ws.getCell('B49').fill = GRN;
    ws.getCell('A54').value = t('repDisclaimer'); ws.getCell('A54').font = font({italic:true, size:9});
    return wb;
  }

  var dl = null;
  function flash(id, msg){ $(id).textContent = msg; }

  /* ---------- Render utama ---------- */
  function renderResults(){
    if (!snap) return;
    var c = snap, rcOld = rc; rc = c.cur;
    $('results').hidden = false; $('placeholder').hidden = true;
    var w = '';
    if (c.hm > c.life) w += '<div class="alert">' + t('warnLife', nf.format(c.life)) + '</div>';
    if (c.price <= 0) w += '<div class="alert">' + t('warnPrice') + '</div>';
    if (c.fair === 0 && c.price > 0) w += '<div class="alert">' + t('warnFair') + '</div>';
    $('warn').innerHTML = w;

    $('tBid').textContent = pri(c.bid);
    $('tBidRp').textContent = oth(c.bid, c.fx);
    $('tFair').textContent = pri(c.fair);
    $('tFairRp').textContent = oth(c.fair, c.fx);
    $('tBook').textContent = pri(c.book);
    $('tBookS').textContent = t('sBook');
    $('thCur').textContent = sym();

    var cmp = '';
    if (c.mkt != null && c.fair > 0){
      var d = (c.mkt / c.fair - 1) * 100;
      var cls = Math.abs(d) <= 10 ? 'good' : (d > 0 ? 'bad' : 'warn');
      var txt = d > 0 ? t('cmpAbove', nf.format(Math.round(d))) : (d < 0 ? t('cmpBelow', nf.format(Math.round(-d))) : t('cmpSame'));
      cmp = '<span class="pill ' + cls + '">' + txt + '</span>';
    }

    var r = '';
    r += row(t('rPrice'), plain(c.price), t('nInput'));
    if (c.adv) r += row(t('rTyreMinus'), plain(-c.tyre), t('nTyreSep'), 'neg');
    r += row(t('rBase'), plain(c.base), c.adv ? t('nBase') : '', 'sum');
    r += row(t('rResid'), plain(c.resid), t('nResid', nf2.format(c.res * 100)));
    r += row(t('rNetDep'), plain(c.netDep), t('nNetDep'));
    r += row(t('rPerHr'), m2(c.perHr), t('nPerHr', nf.format(c.life), t(WK[c.wi])));
    r += row(t('rDepUsed'), plain(-c.dep), t('nDepUsed', m2(c.perHr), nf.format(c.usedHm)), 'neg');
    r += row(t('rBookNt'), plain(c.bookNoTyre), t('nBookNt'), 'sum');
    if (c.adv){
      r += row(t('rTyreVal'), plain(c.tyreVal), t('nTyreVal', nf.format(Math.round(c.tread * 100))));
      r += row(t('rBookTot'), plain(c.book), '', 'sum');
    }
    r += row(t('rCond'), plain(c.adj), t('nCond', nf.format(Math.round(c.cond * 100))));
    if (c.adv) r += row(t('rDefer'), plain(-c.deferred), t('nDefer', nf.format(Math.round(c.ohw * 100))), 'neg');
    r += row(t('rRepair'), plain(-c.repair), t('nInput'), 'neg');
    if (c.adv) r += row(t('rLogi'), plain(-c.logi), t('nInput'), 'neg');
    r += row(t('rFair'), plain(c.fair), cmp, 'sum');
    r += row(t('rMargin'), plain(-(c.fair - c.bid)), t('nMargin', nf.format(Math.round(c.margin * 100))), 'neg');
    r += row(t('rBid'), plain(c.bid), t('nBid'), 'sum');
    $('rows').innerHTML = r;

    var ct = '';
    c.byWork.forEach(function(b, i){
      var dd = b.book - c.byWork[c.wi].book;
      ct += '<tr class="' + (i === c.wi ? 'sel' : '') + '"><td>' + t(WK[i]) + '</td><td class="n">' + nf.format(b.life) + '</td><td class="n">' + plain(b.book) + '</td><td class="n">' + (i === c.wi ? '-' : (dd > 0 ? '+' : '') + plain(dd)) + '</td></tr>';
    });
    $('condTbl').innerHTML = ct;

    chart(c);

    var age = ageOf(c), u = '';
    if (age){
      var perYr = c.hm / age, ratio = perYr / Math.max(1, c.annual);
      var pc = ratio <= 1.1 ? 'good' : (ratio <= 1.4 ? 'warn' : 'bad');
      var lab = ratio <= 0.85 ? t('uLow') : (ratio <= 1.1 ? t('uOk') : t('uHigh'));
      u = '<p>' + t('uText', age, nf.format(Math.round(perYr)), nf.format(c.annual)) + ' <span class="pill ' + pc + '">' + lab + '</span></p>';
    }
    $('usage').innerHTML = u;

    var offs = [-4000, -2000, 0, 2000, 4000], sr = '';
    offs.forEach(function(o){
      var h = Math.max(0, c.hm + o);
      var v = c.base - c.perHr * Math.min(h, c.life);
      var dd = v - c.bookNoTyre;
      sr += '<tr class="' + (o === 0 ? 'sum' : '') + '"><td>' + nf.format(h) + '</td><td class="n">' + plain(v) + '</td><td class="n">' + (o === 0 ? '-' : (dd > 0 ? '+' : '') + plain(dd)) + '</td></tr>';
    });
    $('sens').innerHTML = sr;

    if (reportOpen) renderReport(c);
    rc = rcOld;
  }

  function updateActive(){
    var wi = parseInt($('work').value, 10) || 0;
    ['t0','t1','t2'].forEach(function(k, i){
      var el = document.querySelector('#triLife .' + k); if (el) el.className = k + (i === wi ? ' on' : '');
    });
  }
  function updateStaleUI(){
    $('stale').hidden = !(snap && stale);
    $('results').classList.toggle('stale', !!(snap && stale));
  }
  function onEdit(){ if (snap){ stale = true; } updateStaleUI(); updateActive(); }

  function applyLang(){
    rc = cur;
    document.documentElement.lang = lang;
    document.title = t('title');
    document.body.setAttribute('data-mode', mode);
    var i, els;
    els = document.querySelectorAll('[data-i18n]');
    for (i = 0; i < els.length; i++) els[i].textContent = t(els[i].getAttribute('data-i18n'));
    els = document.querySelectorAll('[data-i18n-html]');
    for (i = 0; i < els.length; i++) els[i].innerHTML = t(els[i].getAttribute('data-i18n-html'));
    els = document.querySelectorAll('[data-i18n-ph]');
    for (i = 0; i < els.length; i++) els[i].setAttribute('placeholder', t(els[i].getAttribute('data-i18n-ph')));
    els = document.querySelectorAll('[data-i18n-aria]');
    for (i = 0; i < els.length; i++) els[i].setAttribute('aria-label', t(els[i].getAttribute('data-i18n-aria')));
    for (i = 0; i < 5; i++){
      $('c' + i + 'c').setAttribute('aria-label', t('comp' + i) + ' - ' + t('thCost'));
      $('c' + i + 'u').setAttribute('aria-label', t('comp' + i) + ' - ' + t('thUsed'));
    }
    $('langId').setAttribute('aria-pressed', lang === 'id' ? 'true' : 'false');
    $('langEn').setAttribute('aria-pressed', lang === 'en' ? 'true' : 'false');
    $('curUsd').setAttribute('aria-pressed', cur === 'USD' ? 'true' : 'false');
    $('curIdr').setAttribute('aria-pressed', cur === 'IDR' ? 'true' : 'false');
    $('modeSimple').setAttribute('aria-pressed', mode === 'simple' ? 'true' : 'false');
    $('modeAdv').setAttribute('aria-pressed', mode === 'adv' ? 'true' : 'false');
    ['saveMsg','actMsg','repMsg'].forEach(function(id){ $(id).textContent = ''; });
    var keep = $('preset').value; fillSelect(keep);
    setLocale(); setSteps();
    $('modeNote').textContent = t(isAdv() ? 'modeNoteA' : 'modeNoteS');
    updateActive();
    renderResults(); updateStaleUI();
    if (reportOpen && snap) inCur(snap.cur, function(){ renderReport(snap); });
  }
  function setLang(l){ lang = l; try { localStorage.setItem(LANGKEY, l); } catch (e) {} applyLang(); }
  function setMode(m){ if (snap && m !== mode) stale = true; mode = m; try { localStorage.setItem(MODEKEY, m); } catch (e) {} applyLang(); }
  function setCur(code){
    if (code === cur) return;
    var fx = fxNow();
    MONEY.forEach(function(k){
      var raw = $(k).value.trim(); if (raw === '') return;
      var v = parseFloat(raw); if (!isFinite(v)) return;
      if (code === 'IDR') $(k).value = Math.round(v * fx);
      else $(k).value = Math.round(v / fx * 100) / 100;
    });
    cur = code;
    try { localStorage.setItem(CURKEY, code); } catch (e) {}
    applyLang();
  }
  $('langId').addEventListener('click', function(){ setLang('id'); });
  $('langEn').addEventListener('click', function(){ setLang('en'); });
  $('curUsd').addEventListener('click', function(){ setCur('USD'); });
  $('curIdr').addEventListener('click', function(){ setCur('IDR'); });
  $('modeSimple').addEventListener('click', function(){ setMode('simple'); });
  $('modeAdv').addEventListener('click', function(){ setMode('adv'); });

  allIds.forEach(function(k){ $(k).addEventListener('input', onEdit); $(k).addEventListener('change', onEdit); });
  $('preset').addEventListener('change', function(){ applyPreset(this.value); onEdit(); });
  $('savePreset').addEventListener('click', function(){
    var name = $('pname').value.trim(), msg = $('saveMsg');
    if (!name){ msg.textContent = t('saveName'); return; }
    var p = {name:name, group:'mine', price:toUsd(num('price')), tyre:toUsd(num('tyre')), res:num('res'), annual:num('annual', 1),
             life:[num('lifeL', 1), num('lifeM', 1), num('lifeH', 1)]};
    var idx = -1; custom.forEach(function(x, i){ if (x.name === name) idx = i; });
    if (idx >= 0) custom[idx] = p; else custom.push(p);
    var saved = true;
    try { localStorage.setItem(KEY, JSON.stringify(custom)); } catch (e) { saved = false; }
    fillSelect(CATP.length + OTHERP.length + (idx >= 0 ? idx : custom.length - 1));
    msg.textContent = saved ? t('saveOk', name) : t('saveNo');
    $('pname').value = '';
  });

  $('btnAppraisal').addEventListener('click', function(){
    snap = compute(); stale = false;
    reportOpen = true; $('report').hidden = false; $('repMsg').textContent = ''; $('actMsg').textContent = '';
    renderResults(); updateStaleUI();
    inCur(snap.cur, function(){ renderReport(snap); });
    try { $('report').scrollIntoView({behavior:'smooth', block:'nearest'}); } catch (e) {}
  });
  $('repClose').addEventListener('click', function(){ reportOpen = false; $('report').hidden = true; });
  $('repCopy').addEventListener('click', function(){
    if (!snap) return;
    var txt = inCur(snap.cur, function(){ return reportText(snap); });
    var ok = function(){ flash('repMsg', t('copied')); }, no = function(){ flash('repMsg', t('copyFail')); };
    try { navigator.clipboard.writeText(txt).then(ok, no); } catch (e) { no(); }
  });

  $('btnExport').addEventListener('click', function(){
    flash('actMsg', '');
    if (!dl) return;
    if (!snap || stale){ flash('actMsg', t('xNeed')); return; }
    if (!window.ExcelJS){ flash('actMsg', t('xNoLib')); return; }
    var c = snap, wb;
    try { wb = inCur(c.cur, function(){ return buildXlsx(c); }); } catch (e) { flash('actMsg', t('xFail', 'build')); return; }
    var nm = (c.name || 'unit').replace(/[^A-Za-z0-9_-]+/g, '_');
    var yr = c.adv ? c.yearRaw : '';
    var fname = 'Appraisal_' + nm + (yr ? '_' + yr : '') + '.xlsx';
    wb.xlsx.writeBuffer().then(function(buf){
      return dl.save({filename:fname, data:buf});
    }).then(function(){ flash('actMsg', t('xSaved')); }, function(err){
      var code = err && err.code;
      flash('actMsg', code === 'declined' ? t('xDeclined') : t('xFail', code || 'error'));
    });
  });

  // kemampuan unduhan: sembunyikan tombol bila tidak tersedia
  (function(){
    try {
      if (window.claude && typeof window.claude.use === 'function'){
        window.claude.use('downloads').then(function(d){
          dl = d || null;
          if (!dl) $('btnExport').hidden = true;
        }, function(){ $('btnExport').hidden = true; });
      } else { $('btnExport').hidden = true; }
    } catch (e) { $('btnExport').hidden = true; }
  })();

  applyLang();
  /*TESTHOOK*/
})();
</script>
</body>
